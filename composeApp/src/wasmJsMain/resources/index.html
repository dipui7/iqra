<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AlifUp — learn to read the Quran</title>
  <meta name="description" content="Learn to read the Quran, letter by letter. Free, no ads, no account.">
  <meta name="theme-color" content="#2E8B62">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AlifUp">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E6DC; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #2E8B62; background: #F7F5EE; }
    #loading .letters { font-size: 56px; letter-spacing: 8px; font-family: serif; }
    #loading p { color: #6B7570; margin-top: 8px; }
  </style>
  <script src="composeApp.js"></script>
</head>
<body>
  <div id="loading"><div class="letters" dir="rtl">ا ب ت ث</div><p>Loading AlifUp…</p></div>
